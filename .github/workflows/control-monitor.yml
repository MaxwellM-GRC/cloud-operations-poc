name: Operations Control Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "25 8 * * 1-5"
  push:
    branches: [main]
    paths:
      - "config.yaml"
      - "data/**"
      - "src/**"
      - ".github/workflows/control-monitor.yml"

permissions:
  contents: read
  issues: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Evaluate complete operations population
        id: control
        continue-on-error: true
        run: python -m src.main --fail-on-findings
      - name: Retain evidence and individual exception cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operations-control-evidence-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: 90
      - name: Open or update exception cases
        if: steps.control.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'output/cases';
            if (!fs.existsSync(path)) {
              core.warning('No exception cases were generated; source validity requires human review.');
              return;
            }
            const cases = fs.readdirSync(path).filter((name) => name.endsWith('.md'));
            const { owner, repo } = context.repo;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'itgc-ops-001', per_page: 100,
            });
            for (const filename of cases) {
              const findingId = filename.slice(0, -3);
              const title = `ITGC-OPS-001 ${findingId} — human decision required`;
              const body = fs.readFileSync(`${path}/${filename}`, 'utf8');
              const match = existing.find((issue) => issue.title === title);
              if (match) {
                await github.rest.issues.update({ owner, repo, issue_number: match.number, title, body });
              } else {
                await github.rest.issues.create({
                  owner, repo, title, body,
                  labels: ['itgc-ops-001', 'exception-case', 'human-closure-required'],
                });
              }
            }
      - name: Surface control exceptions after preserving evidence
        if: steps.control.outcome == 'failure'
        run: |
          echo "ITGC-OPS-001 detected exceptions. Review the uploaded register and individual cases."
          exit 1
